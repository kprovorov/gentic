name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable placeholder local Clerk auth
        run: |
          perl -0pi -e 's/(\[auth\.third_party\.clerk\]\nenabled = )true/${1}false/' supabase/config.toml

      - name: Start Supabase
        run: pnpm dlx supabase@2.109.1 start

      - name: Verify generated Supabase types
        run: pnpm db:types:check

      - name: Lint local database
        run: pnpm dlx supabase@2.109.1 db lint --local

      - name: pgTAP tests
        run: pnpm db:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Exposes the running local instance to the live Automatic Review E2E
      # tests (apps/web/tests/automatic-review-e2e-*.test.ts,
      # apps/web/tests/helpers/live-review-harness.ts), which otherwise skip
      # themselves — these are the fixed local-dev demo keys the Supabase
      # CLI prints for every project, not secrets. If the override names
      # below drift from a future CLI version, `pnpm dlx supabase@2.109.1
      # status -o env` (no overrides) in this job's log shows the current
      # dot-paths to fix them with.
      #
      # `-o env` quotes every value (KEY="VALUE") for shell `source`/`export`
      # use, but $GITHUB_ENV isn't shell-evaluated — it parses plain
      # KEY=VALUE lines — so appending the CLI's output directly bakes the
      # literal quote characters into each value (e.g. SUPABASE_URL becomes
      # `"http://127.0.0.1:54321"`, which @supabase/supabase-js then rejects
      # as an invalid URL). Strip the surrounding quotes before appending.
      - name: Expose local Supabase credentials to Root tests
        run: |
          pnpm dlx supabase@2.109.1 status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Root tests
        env:
          TZ: UTC
          REQUIRE_LIVE_SUPABASE: "1"
        run: pnpm test

      - name: Agent tests in non-UTC timezone
        env:
          TZ: America/Los_Angeles
        run: pnpm --filter @gentic/gentic test

      - name: Production build
        run: pnpm build
