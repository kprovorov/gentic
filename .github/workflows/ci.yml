name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable placeholder local Clerk auth
        run: |
          perl -0pi -e 's/(\[auth\.third_party\.clerk\]\nenabled = )true/${1}false/' supabase/config.toml

      - name: Start Supabase
        run: pnpm dlx supabase@2.109.1 start

      - name: Verify generated Supabase types
        run: pnpm db:types:check

      - name: Lint local database
        run: pnpm dlx supabase@2.109.1 db lint --local

      - name: pgTAP tests
        run: pnpm db:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Exposes the running local instance to the live Automatic Review E2E
      # tests (apps/web/tests/automatic-review-e2e-*.test.ts,
      # apps/web/tests/helpers/live-review-harness.ts), which otherwise skip
      # themselves — these are the fixed local-dev demo keys the Supabase
      # CLI prints for every project, not secrets. If the override name
      # below drifts from a future CLI version, `pnpm dlx supabase@2.109.1
      # status -o env` (no overrides) in this job's log shows the current
      # dot-paths to fix it with.
      #
      # `-o env` quotes every value (KEY="VALUE") for shell `source`/`export`
      # use, but $GITHUB_ENV isn't shell-evaluated — it parses plain
      # KEY=VALUE lines — so appending the CLI's output directly bakes the
      # literal quote characters into each value (e.g. SUPABASE_URL becomes
      # `"http://127.0.0.1:54321"`, which @supabase/supabase-js then rejects
      # as an invalid URL). Strip the surrounding quotes before appending.
      #
      # The secret key comes from the CLI's own default `SECRET_KEY` var
      # (renamed below), not an `--override-name auth.service_role_key=...`
      # dot-path: this CLI version has already migrated the project to
      # Supabase's newer publishable/secret API key pair (also visible as
      # `PUBLISHABLE_KEY`/`SECRET_KEY` in this step's own env dump), and the
      # legacy `service_role_key` dot-path still resolves to *a* JWT but one
      # PostgREST no longer maps to real `service_role` table grants under
      # that key scheme — every table access then fails with "permission
      # denied", exactly the class of failure this live tier exists to
      # catch, now caught in the plumbing that feeds it rather than in the
      # tests themselves.
      - name: Expose local Supabase credentials to Root tests
        run: |
          pnpm dlx supabase@2.109.1 status -o env \
            --override-name api.url=SUPABASE_URL \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' \
            | sed -E 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' \
            >> "$GITHUB_ENV"

      - name: Root tests
        env:
          TZ: UTC
          REQUIRE_LIVE_SUPABASE: "1"
        run: pnpm test

      - name: Agent tests in non-UTC timezone
        env:
          TZ: America/Los_Angeles
        run: pnpm --filter @gentic/gentic test

      - name: Production build
        run: pnpm build

      # The published CLI is a bundle, not the tsc output, so `pnpm build`
      # passing says nothing about whether `npm install -g gentic-cli` still
      # works. Stage it here and run the real bundle so a broken bundle fails
      # on the pull request rather than mid-release.
      - name: Stage npm package
        run: pnpm --filter @gentic/gentic build:npm

      - name: Smoke-test the npm bundle
        run: |
          node apps/gentic/dist/npm/bin/gentic.js --version
          npm pack --dry-run ./apps/gentic/dist/npm
