packages:
  - apps/*
  - packages/*

overrides:
  zod: 4.4.3

packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  cpu-features: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@agentclientprotocol/claude-agent-acp@0.55.0 || 0.59.0'
  - '@clerk/mcp-tools@0.6.0'
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
